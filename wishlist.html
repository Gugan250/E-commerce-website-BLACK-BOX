<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Black Box - Wishlist</title>

    <link rel="stylesheet" href="wishlist.css">
    <link rel="icon" href="img file/image 2.png">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <header>

        <a href="Home.html">
            <img src="img file/image 1.png" alt="Black Box" class="logo">
        </a>

        <nav class="navbar">

            <ul class="navlink">

                <li>
                    <a href="index.html">
                        <i class="fa-solid fa-house"></i>
                        <span>HOME</span>
                    </a>
                </li>

                <li>
                    <a href="Products.html">
                        <i class="fa-solid fa-boxes-stacked"></i>
                        <span>PRODUCTS</span>
                    </a>
                </li>

                <li>
                    <a href="cart.html">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span>CART</span>
                    </a>
                </li>

                <li>
                    <a href="wishlist.html">
                        <i class="fa-solid fa-heart"></i>
                        <span>WISHLIST</span>
                    </a>
                </li>

                <li>
                    <a href="account.html">
                        <i class="fa-solid fa-user"></i>
                        <span>ACCOUNT</span>
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main class="wishlist">

        <h1>My Wishlist</h1>

        <div id="wishlist-items" class="wishlist-grid"></div>

        <div id="empty-wishlist" class="empty-wishlist">

            <i class="fa-regular fa-heart"></i>

            <h2>Your Wishlist is Empty</h2>

            <p>Add products you love to your wishlist.</p>

            <a href="Products.html">
                Continue Shopping
            </a>

        </div>

    </main>


    <script src="wishlist.js"></script>

</body>

</html>
