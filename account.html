<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Black Box - Account</title>

    <link rel="stylesheet"
          href="account.css">

    <link rel="icon"
          href="img file/image 2.png">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>

    <header>

        <a href="index.html">

            <img src="img file/image 1.png"
                 alt="Black Box"
                 class="logo">

        </a>


        <nav class="navbar">

            <ul class="navlink">

                <li>
                    <a href="index.html">
                        <i class="fa-solid fa-house"></i>
                        <span>HOME</span>
                    </a>
                </li>


                <li>
                    <a href="Products.html">
                        <i class="fa-solid fa-boxes-stacked"></i>
                        <span>PRODUCTS</span>
                    </a>
                </li>


                <li>
                    <a href="cart.html">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span>CART</span>
                    </a>
                </li>


                <li>
                    <a href="wishlist.html">
                        <i class="fa-solid fa-heart"></i>
                        <span>WISHLIST</span>
                    </a>
                </li>


                <li>
                    <a href="Account.html">
                        <i class="fa-solid fa-user"></i>
                        <span>ACCOUNT</span>
                    </a>
                </li>

            </ul>

        </nav>

    </header>

    <main class="account">

        <h1>My Account</h1>

        <section class="profile-card">

            <div class="profile-icon">

                <i class="fa-solid fa-user"></i>

            </div>


            <div class="profile-info">

                <h2>Welcome to Black Box</h2>

                <p>
                    Manage your account and orders
                </p>

            </div>

        </section>


        <section class="account-options">

            <a href="#" class="account-card">

                <div class="account-card-icon">

                    <i class="fa-solid fa-box"></i>

                </div>

                <div>

                    <h3>My Orders</h3>

                    <p>
                        View your recent orders
                    </p>

                </div>

                <i class="fa-solid fa-chevron-right arrow"></i>

            </a>

            <a href="Wishlist.html" class="account-card">

                <div class="account-card-icon">

                    <i class="fa-solid fa-heart"></i>

                </div>

                <div>

                    <h3>My Wishlist</h3>

                    <p>
                        View your saved products
                    </p>

                </div>

                <i class="fa-solid fa-chevron-right arrow"></i>

            </a>

            <a href="Cart.html" class="account-card">

                <div class="account-card-icon">

                    <i class="fa-solid fa-cart-shopping"></i>

                </div>

                <div>

                    <h3>My Cart</h3>

                    <p>
                        View products in your cart
                    </p>

                </div>

                <i class="fa-solid fa-chevron-right arrow"></i>

            </a>

            <a href="Products.html" class="account-card">

                <div class="account-card-icon">

                    <i class="fa-solid fa-bag-shopping"></i>

                </div>

                <div>

                    <h3>Continue Shopping</h3>

                    <p>
                        Explore our products
                    </p>

                </div>

                <i class="fa-solid fa-chevron-right arrow"></i>

            </a>


        </section>

        <button class="logout-btn" id="logout-btn">

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </button>


    </main>



    <script src="account.js"></script>

</body>

</html>
