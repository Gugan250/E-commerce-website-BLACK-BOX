<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Black Box - Checkout</title>
    <link rel="icon" href="img file/image 2.png">
    <link rel="stylesheet" href="checkout.css">

</head>

<body>

    <h1>Checkout</h1>

    <form id="checkout-form">

        <h2>Delivery Details</h2>

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            required
        >

        <input
            type="tel"
            id="phone"
            placeholder="Phone Number"
            required
        >

        <textarea
            id="address"
            placeholder="Delivery Address"
            required
        ></textarea>

        <input
            type="text"
            id="city"
            placeholder="City"
            required
        >

        <input
            type="text"
            id="pincode"
            placeholder="Pincode"
            required
        >

        <h2>Payment Method</h2>

        <label>
            <input
                type="radio"
                name="payment"
                value="cod"
                required
            >
            Cash on Delivery
        </label>

        <label>
            <input
                type="radio"
                name="payment"
                value="online"
            >
            Online Payment
        </label>

        <button type="submit">
            Place Order
        </button>

    </form>

    <script src="checkout.js"></script>

</body>

</html>
