<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Black Box - Create Account</title>

    <link rel="stylesheet"
          href="signup.css">

    <link rel="icon" href="img file/favicon.png">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>

    <main class="signup-container">

        <div class="signup-box">

            <div class="signup-icon">
                <i class="fa-solid fa-user-plus"></i>
            </div>


            <h1>Create Account</h1>

            <p>Create your Black Box account</p>


            <form id="signup-form">

                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required>

                </div>

                <div class="input-group">

                    <label for="email">
                        Gmail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your Gmail"
                        autocomplete="email"
                        required>

                </div>

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required>

                        <button
                            type="button"
                            id="show-password">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>

                <div class="input-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm your password"
                        required>

                </div>

                <p id="signup-error"></p>

                <button
                    type="submit"
                    class="signup-submit">

                    CREATE ACCOUNT

                </button>

            </form>


            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <script src="signup.js"></script>

</body>

</html>
